requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fuzzywuzzy>=0.18.0",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-levenshtein>=0.27.4",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
